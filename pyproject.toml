[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esi-kinetics-analysis"
version = "0.1.0"
description = "GUI-assisted scientific image summation and brightness analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "imageio-ffmpeg>=0.6",
  "Pillow>=10.0",
  "pandas>=2.0",
  "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
